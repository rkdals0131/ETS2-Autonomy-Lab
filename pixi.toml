# Windows-native ROS 2 Jazzy (RoboStack): build, relay node, launcher. docs/20, docs/22.
# Visual Studio 2022+ C++ build tools must be installed separately. Run every
# ROS build or command through `pixi run` / `pixi shell` (PATH holds Python 2.7).
[workspace]
name = "ets2-autonomy-lab"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["win-64"]

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
ros-jazzy-vision-msgs = "*"
ros-jazzy-foxglove-bridge = "*"  # Needs the Library\lib PATH entry in ros2/activate.bat.
ros-jazzy-rosbag2-storage-mcap = "*"
ros-jazzy-ament-cmake-gtest = "*"
colcon-common-extensions = "*"
compilers = "*"
nlohmann_json = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"

[activation]
# Overlay (when built) and the shared DDS profile for every process, not only launch files.
scripts = ["ros2/activate.bat"]
env = { ROS_DOMAIN_ID = "42", RMW_IMPLEMENTATION = "rmw_fastrtps_cpp", ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST" }

[tasks]
build = { cmd = "colcon build --merge-install --packages-select ets2_msgs ets2_relay ets2_sensor_degradation ets2_autonomy --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON", cwd = "ros2" }
# Relay alone (host only): pixi run relay bridge/config/bridge.local.json [stop-event] [--input-only]
relay = { cmd = "ros2/install/lib/ets2_relay/ets2_relay.exe" }
# Detached GUI: the activated environment passes to pythonw and everything it starts.
launcher = { cmd = "cmd /c start \"\" pythonw apps/launcher/launcher.py" }
